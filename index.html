<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heritage Explorer - Vigan</title>
  
  <!-- Client-side HTML-to-Image Library (No backend needed) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-parchment: #fdfbf7;
      --card-bg: #faf6ee;
      --card-border: #3b2d1d;
      --card-inner-border: #8b5a2b;
      --gold: #b38b32;
      --deep-red: #7c2222;
      --text-dark: #2d241e;
      --text-muted: #5a4a3e;
      --panel-bg: #f4ecdc;
      --visited-green: #2d6a4f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-parchment);
      color: var(--text-dark);
      font-family: 'Georgia', 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .main-container {
      background-color: var(--card-bg);
      border: 3px double var(--card-border);
      outline: 1px solid var(--card-inner-border);
      outline-offset: -7px;
      border-radius: 6px;
      max-width: 960px;
      width: 100%;
      padding: 24px 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    /* Top Utility Bar */
    .top-header-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 4px;
    }

    .tracker-pill {
      background: var(--panel-bg);
      border: 1.5px solid var(--card-inner-border);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tracker-score {
      color: var(--deep-red);
      font-size: 0.95rem;
    }

    .sub-heading {
      text-align: center;
      color: var(--gold);
      font-size: 0.85rem;
      letter-spacing: 2.5px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .main-title {
      text-align: center;
      font-size: 1.8rem;
      color: var(--text-dark);
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .divider {
      border: none;
      border-top: 1.5px solid #4a3728;
      margin: 0 auto 20px;
    }

    .interactive-section {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    /* Target Export Container (This whole box gets photographed) */
    #shareable-map-card {
      position: relative;
      height: 480px;
      border: 2px solid #5a4532;
      border-radius: 4px;
      background-color: #ede3d2;
      background-size: cover;
      background-position: center;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
    }

    /* Miniature Landmark Cards */
    .miniature-marker {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      transition: transform 0.2s ease;
    }

    .miniature-marker:hover {
      transform: translate(-50%, -50%) scale(1.1);
      z-index: 20;
    }

    .thumb-wrap {
      width: 58px;
      height: 58px;
      border-radius: 6px;
      border: 2px solid #5a4532;
      background: #dfd3c3;
      overflow: hidden;
      box-shadow: 0 3px 6px rgba(0,0,0,0.25);
      position: relative;
    }

    .mini-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Default Unvisited State: Sepia / Monochrome Sketch */
      filter: grayscale(100%) brightness(90%) sepia(20%);
      transition: filter 0.3s ease;
    }

    .miniature-marker.visited .mini-img {
      /* Visited State: Full Color / Vibrant */
      filter: grayscale(0%) brightness(100%);
    }

    .miniature-marker.visited .thumb-wrap {
      border: 2.5px solid var(--gold);
      box-shadow: 0 0 8px rgba(179, 139, 50, 0.6);
    }

    .badge-num {
      position: absolute;
      top: -6px;
      left: -6px;
      width: 18px;
      height: 18px;
      background: var(--deep-red);
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #fff;
    }

    .miniature-marker.visited .badge-num {
      background: var(--visited-green);
    }

    .label-tag {
      background: rgba(253, 251, 247, 0.95);
      border: 1px solid #7c624a;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 0.68rem;
      font-weight: bold;
      color: var(--text-dark);
      margin-top: 3px;
      white-space: nowrap;
    }

    /* Dossier Panel */
    .profile-panel {
      background: var(--panel-bg);
      border: 1px solid #c4b396;
      border-left: 4px solid var(--gold);
      border-radius: 4px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      height: 480px;
      overflow-y: auto;
    }

    .image-container {
      width: 100%;
      height: 150px;
      background: #dfd3c3;
      border: 1.5px solid #7c624a;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .site-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-caption {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-style: italic;
    }

    .photo-caption a {
      color: var(--text-dark);
      text-decoration: underline;
    }

    .profile-tag {
      font-size: 0.72rem;
      font-weight: bold;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .profile-name {
      font-size: 1.25rem;
      color: var(--deep-red);
      font-weight: bold;
      margin-bottom: 2px;
    }

    .profile-alt-name {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 8px;
      border-bottom: 1px dashed #d1c1a5;
      padding-bottom: 4px;
    }

    .profile-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .profile-desc {
      font-size: 0.84rem;
      line-height: 1.45;
      color: var(--text-dark);
      margin-bottom: 10px;
    }

    .stamp-btn {
      background-color: var(--panel-bg);
      border: 1.5px solid var(--deep-red);
      color: var(--deep-red);
      border-radius: 4px;
      padding: 7px 12px;
      font-family: 'Georgia', serif;
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .stamp-btn:hover {
      background-color: #eee0cc;
    }

    .stamp-btn.active-stamp {
      background-color: var(--visited-green);
      border-color: #1b4332;
      color: #ffffff;
    }

    .source-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      border-top: 1px solid #d1c1a5;
      padding-top: 6px;
      margin-top: auto;
    }

    .source-meta a {
      color: var(--deep-red);
      font-weight: bold;
      text-decoration: none;
    }

    /* Footer & Buttons */
    .footer-bar {
      border-top: 1px dashed #7a634e;
      padding-top: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .share-btn {
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      border: none;
      font-family: 'Georgia', serif;
      background: var(--deep-red);
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    .share-btn:hover {
      background: #5c1818;
    }
  </style>
</head>
<body>

  <div class="main-container">
    
    <!-- Top Tracker -->
    <div class="top-header-bar">
      <div class="tracker-pill">
        <span>Visited:</span>
        <span class="tracker-score" id="score-counter">0 / 5</span>
      </div>
    </div>

    <div class="sub-heading">Heritage Explorer</div>
    <h1 class="main-title">Vigan</h1>
    <hr class="divider">

    <div class="interactive-section">
      
      <!-- Visual Illustrated Map Board (Export Target) -->
      <div id="shareable-map-card">
        
        <!-- 1. Bantay Church -->
        <div class="miniature-marker" id="marker-0" style="top: 16%; left: 74%;" onclick="selectSite(0)">
          <div class="thumb-wrap">
            <span class="badge-num" id="badge-0">1</span>
            <img class="mini-img" src="https://upload.wikimedia.org/wikipedia/commons/1/17/The_Bantay_Church.jpg" alt="Bantay Church">
          </div>
          <div class="label-tag">Bantay Church</div>
        </div>

        <!-- 2. Padre Burgos House -->
        <div class="miniature-marker" id="marker-1" style="top: 42%; left: 26%;" onclick="selectSite(1)">
          <div class="thumb-wrap">
            <span class="badge-num" id="badge-1">2</span>
            <img class="mini-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/Padre_Burgos_House_National_Museum_Ilocos_%28Burgos_Street%2C_Vigan%2C_Ilocos_Sur%3B_11-14-2022%29.jpg/1280px-Padre_Burgos_House_National_Museum_Ilocos_%28Burgos_Street%2C_Vigan%2C_Ilocos_Sur%3B_11-14-2022%29.jpg" alt="Padre Burgos House">
          </div>
          <div class="label-tag">Padre Burgos House</div>
        </div>

        <!-- 3. Archdiocese of Nueva Segovia -->
        <div class="miniature-marker" id="marker-2" style="top: 48%; left: 56%;" onclick="selectSite(2)">
          <div class="thumb-wrap">
            <span class="badge-num" id="badge-2">3</span>
            <img class="mini-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Archbishop%27s_Palace_%28Palacio_de_Arzobispado%29_Nueva_Segovia_2.jpg/1280px-Archbishop%27s_Palace_%28Palacio_de_Arzobispado%29_Nueva_Segovia_2.jpg" alt="Nueva Segovia">
          </div>
          <div class="label-tag">Nueva Segovia</div>
        </div>

        <!-- 4. Cathedral of Vigan -->
        <div class="miniature-marker" id="marker-3" style="top: 62%; left: 50%;" onclick="selectSite(3)">
          <div class="thumb-wrap">
            <span class="badge-num" id="badge-3">4</span>
            <img class="mini-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Katedralen_i_Vigan_20180707i.jpg/1920px-Katedralen_i_Vigan_20180707i.jpg" alt="Vigan Cathedral">
          </div>
          <div class="label-tag">Vigan Cathedral</div>
        </div>

        <!-- 5. Syquia Mansion -->
        <div class="miniature-marker" id="marker-4" style="top: 82%; left: 68%;" onclick="selectSite(4)">
          <div class="thumb-wrap">
            <span class="badge-num" id="badge-4">5</span>
            <img class="mini-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Side_of_Syquia_Mansion.jpg/1280px-Side_of_Syquia_Mansion.jpg" alt="Syquia Mansion">
          </div>
          <div class="label-tag">Syquia Mansion</div>
        </div>

      </div>

      <!-- Dossier Panel -->
      <div class="profile-panel">
        <div class="image-container">
          <img id="loc-img" class="site-photo" src="" alt="Heritage Site Image">
        </div>
        <div class="photo-caption" id="loc-credit"></div>

        <div class="profile-tag" id="loc-period"></div>
        <h2 class="profile-name" id="loc-name"></h2>
        <div class="profile-alt-name" id="loc-alt"></div>

        <!-- Visited Stamp Button -->
        <button id="stamp-btn" class="stamp-btn" onclick="toggleVisitedCurrentSite()">
          <span>+ Mark as Visited</span>
        </button>

        <div class="profile-meta">
          <div><strong>Type:</strong> <span id="loc-category"></span> | <strong>Status:</strong> <span id="loc-status"></span></div>
          <div><strong>Built:</strong> <span id="loc-build"></span> | <strong>Coordinates:</strong> <span id="loc-geo"></span></div>
        </div>

        <p class="profile-desc" id="loc-desc"></p>
        <div class="source-meta" id="loc-source"></div>
      </div>

    </div>

    <!-- Share Bar -->
    <div class="footer-bar">
      <button class="share-btn" onclick="captureAndShareMap()">📸 Share Map Image</button>
    </div>

  </div>

  <script>
    const sites = [
      {
        id: 0,
        site_name: "Bantay Church & Watchtower",
        alternate_name: "Parish of Saint Augustine of Hippo",
        lat: 17.58119,
        lng: 120.391667,
        category: "place of worship",
        period: "Spanish Colonial Period",
        build_year: "1590",
        heritage_status: "Historical Sanctuary",
        image_url: "https://upload.wikimedia.org/wikipedia/commons/1/17/The_Bantay_Church.jpg",
        image_source_url: "https://commons.wikimedia.org/wiki/File:The_Bantay_Church.jpg",
        image_credit: "John Lenard Cadungog",
        image_license: "CC BY-SA 4.0",
        hashtag: "#BantayChurch",
        description: "Bantay Church, formally the Parish of Saint Augustine of Hippo and Archdiocesan Shrine of Our Lady of Charity, is a historic Catholic church in Bantay, Ilocos Sur. Heavily damaged during World War II, reconstruction began in 1950. Beside the church stands the historic Bantay Tower, which served as a watchtower during the Spanish colonial period.",
        source_name: "National Historical Commission of the Philippines",
        source_url: "https://philhistoricsites.nhcp.gov.ph/"
      },
      {
        id: 1,
        site_name: "Birthplace of Padre Burgos",
        alternate_name: "Padre Burgos House",
        lat: 17.57558,
        lng: 120.38584,
        category: "historic house",
        period: "Spanish Colonial Period",
        build_year: "1788",
        heritage_status: "Historical Marker",
        image_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/Padre_Burgos_House_National_Museum_Ilocos_%28Burgos_Street%2C_Vigan%2C_Ilocos_Sur%3B_11-14-2022%29.jpg/1280px-Padre_Burgos_House_National_Museum_Ilocos_%28Burgos_Street%2C_Vigan%2C_Ilocos_Sur%3B_11-14-2022%29.jpg",
        image_source_url: "https://commons.wikimedia.org/wiki/File:Padre_Burgos_House_National_Museum_Ilocos_(Burgos_Street,_Vigan,_Ilocos_Sur;_11-14-2022).jpg",
        image_credit: "Patrickroque01",
        image_license: "CC BY-SA 4.0",
        hashtag: "#PadreBurgosHouse",
        description: "Built in 1788, Padre Burgos House is an early bahay na bato associated with the birthplace of José Burgos, born in Vigan in 1837. Burgos became a prominent advocate for the secular clergy and was executed in 1872 alongside Mariano Gomes and Jacinto Zamora (Gomburza).",
        source_name: "National Historical Commission of the Philippines",
        source_url: "https://philhistoricsites.nhcp.gov.ph/registry_database/birthplace-of-father-burgos/"
      },
      {
        id: 2,
        site_name: "Archdiocese of Nueva Segovia",
        alternate_name: "Palacio de Arzobispado",
        lat: 17.57543,
        lng: 120.38868,
        category: "religious/institutional",
        period: "Spanish Colonial Period",
        build_year: "1783–1790",
        heritage_status: "Historical Marker",
        image_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Archbishop%27s_Palace_%28Palacio_de_Arzobispado%29_Nueva_Segovia_2.jpg/1280px-Archbishop%27s_Palace_%28Palacio_de_Arzobispado%29_Nueva_Segovia_2.jpg",
        image_source_url: "https://commons.wikimedia.org/wiki/File:Archbishop%27s_Palace_(Palacio_de_Arzobispado)_Nueva_Segovia_2.jpg",
        image_credit: "A.C.T. Alejandre",
        image_license: "CC BY-SA 4.0",
        hashtag: "#NuevaSegovia",
        description: "This historic building served as the seat of the Diocese of Nueva Segovia after it was transferred from Lal-lo, Cagayan, to Vigan in 1758. It later housed the ecclesiastical court and was occupied during both the Philippine Revolution and the Philippine-American War.",
        source_name: "National Historical Commission of the Philippines",
        source_url: "https://philhistoricsites.nhcp.gov.ph/registry_database/site-of-the-diocese-of-nueva-segovia/"
      },
      {
        id: 3,
        site_name: "Cathedral of Vigan",
        alternate_name: "Vigan Cathedral",
        lat: 17.57482,
        lng: 120.38888,
        category: "place of worship",
        period: "Spanish Colonial Period",
        build_year: "1641",
        heritage_status: "Place of Worship",
        image_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Katedralen_i_Vigan_20180707i.jpg/1920px-Katedralen_i_Vigan_20180707i.jpg",
        image_source_url: "https://commons.wikimedia.org/wiki/File:Katedralen_i_Vigan_20180707i.jpg",
        image_credit: "Katedralen",
        image_license: "CC BY 4.0",
        hashtag: "#ViganCathedral",
        description: "Built in 1641, Vigan Cathedral became the seat of the Diocese of Nueva Segovia when it was transferred to Vigan in 1758. Built in an Earthquake Baroque architectural style with thick buttresses to withstand seismic activity.",
        source_name: "National Historical Commission of the Philippines",
        source_url: "https://philhistoricsites.nhcp.gov.ph/registry_database/cathedral-of-vigan/"
      },
      {
        id: 4,
        site_name: "Syquia Mansion",
        alternate_name: "Heritage House",
        lat: 17.57099,
        lng: 120.38969,
        category: "historic house",
        period: "Spanish Colonial Period",
        build_year: "1830",
        heritage_status: "Heritage House",
        image_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Side_of_Syquia_Mansion.jpg/1280px-Side_of_Syquia_Mansion.jpg",
        image_source_url: "https://commons.wikimedia.org/wiki/File:Side_of_Syquia_Mansion.jpg",
        image_credit: "Markadan",
        image_license: "CC BY 4.0",
        hashtag: "#SyquiaMansion",
        description: "Built in 1830, Syquia Mansion is one of Vigan's historic bahay na bato houses. Originally built by Justo Angco, the house later passed to the Syquia family and became associated with President Elpidio Quirino through his wife, Alicia Syquia.",
        source_name: "National Historical Commission of the Philippines",
        source_url: "https://philhistoricsites.nhcp.gov.ph/registry_database/syquia-mansion/"
      }
    ];

    let visitedSet = new Set();
    let currentSelectedSiteId = 0;

    function selectSite(id) {
      currentSelectedSiteId = id;
      const site = sites[id];
      document.getElementById('loc-img').src = site.image_url;
      document.getElementById('loc-credit').innerHTML = `Photo: <a href="${site.image_source_url}" target="_blank">${site.image_credit}</a> (${site.image_license})`;
      document.getElementById('loc-period').innerText = `${site.period} • ${site.hashtag}`;
      document.getElementById('loc-name').innerText = `${site.id + 1}. ${site.site_name}`;
      document.getElementById('loc-alt').innerText = site.alternate_name ? `Alt: ${site.alternate_name}` : '';
      document.getElementById('loc-category').innerText = site.category;
      document.getElementById('loc-status').innerText = site.heritage_status;
      document.getElementById('loc-build').innerText = site.build_year;
      document.getElementById('loc-geo').innerText = `${site.lat}, ${site.lng}`;
      document.getElementById('loc-desc').innerText = site.description;
      document.getElementById('loc-source').innerHTML = `Source: <a href="${site.source_url}" target="_blank">${site.source_name}</a>`;

      const isVisited = visitedSet.has(id);
      const btn = document.getElementById('stamp-btn');
      if (isVisited) {
        btn.classList.add('active-stamp');
        btn.innerHTML = `<span>✓ Visited</span>`;
      } else {
        btn.classList.remove('active-stamp');
        btn.innerHTML = `<span>+ Mark as Visited</span>`;
      }
    }

    function toggleVisitedCurrentSite() {
      if (visitedSet.has(currentSelectedSiteId)) {
        visitedSet.delete(currentSelectedSiteId);
      } else {
        visitedSet.add(currentSelectedSiteId);
      }

      // Update Miniature Marker appearance
      const marker = document.getElementById(`marker-${currentSelectedSiteId}`);
      const badge = document.getElementById(`badge-${currentSelectedSiteId}`);
      const isVisited = visitedSet.has(currentSelectedSiteId);

      marker.classList.toggle('visited', isVisited);
      badge.innerText = isVisited ? '✓' : (currentSelectedSiteId + 1);

      document.getElementById('score-counter').innerText = `${visitedSet.size} / ${sites.length}`;
      selectSite(currentSelectedSiteId);
    }

    // Client-side visual snapshot capture
    function captureAndShareMap() {
      const mapElement = document.getElementById('shareable-map-card');
      const score = visitedSet.size;
      const shareTitle = "Heritage Explorer - Vigan";
      const shareText = score === 0 
        ? "Exploring historic Vigan on Heritage Explorer!"
        : `I've explored ${score} of 5 historic landmarks in Vigan!`;

      html2canvas(mapElement, { useCORS: true, scale: 2 }).then(async (canvas) => {
        canvas.toBlob(async (blob) => {
          const file = new File([blob], 'vigan-heritage-map.png', { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                title: shareTitle,
                text: shareText,
                files: [file]
              });
            } catch (err) {}
          } else {
            // Desktop fallback: direct download
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'vigan-heritage-map.png';
            a.click();
            alert('Your personalized Heritage Map image has been downloaded!');
          }
        }, 'image/png');
      });
    }

    // Initialize first site
    selectSite(0);
  </script>
</body>
</html>
